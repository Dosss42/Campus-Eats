<ion-card class="food-card" [class.sold-out]="!item.available">

  <div class="image-wrap">
    <img [src]="item.image" [alt]="item.name" loading="lazy" />

    <ion-chip
      class="status-chip"
      [color]="item.available ? 'success' : 'medium'"
      [outline]="!item.available"
    >
      <ion-icon
        [name]="item.available ? 'checkmark-circle' : 'close-circle'"
        aria-hidden="true"
      ></ion-icon>
      <ion-label>{{ item.available ? 'Available' : 'Sold out' }}</ion-label>
    </ion-chip>
  </div>

  <ion-card-header>
    <ion-card-title>{{ item.emoji }} {{ item.name }}</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <p class="description">{{ item.description }}</p>

    <div class="meta">
      <span class="price">PHP {{ item.price }}</span>
      <span class="rating" [attr.aria-label]="item.rating + ' out of 5 rating'">
        <ion-icon name="star-outline" aria-hidden="true"></ion-icon>
        {{ item.rating }}
      </span>
    </div>

    @if (item.available) {
      <ion-button
        expand="block"
        (click)="onAddToCart()"
        [attr.aria-label]="'Add ' + item.name + ' to cart'"
      >
        Add to Cart
      </ion-button>
    } @else {
      <ion-button
        expand="block"
        fill="outline"
        disabled
        [attr.aria-label]="item.name + ' is sold out'"
      >
        Sold Out
      </ion-button>
    }
  </ion-card-content>

</ion-card>
